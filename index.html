<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 방패와 사라진 접속자</title>
<style>
  @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');
  
  body {
    margin: 0; padding: 0; background-color: #111; color: #fff;
    font-family: 'Galmuri11', sans-serif; display: flex; flex-direction: column;
    justify-content: center; align-items: center; height: 100vh; overflow: hidden;
    touch-action: none;
  }

  #game-wrapper {
    position: relative; 
    width: 100vw; 
    height: 75vw; 
    max-width: 640px; 
    max-height: 480px;
    box-shadow: 0 0 20px rgba(0,0,0,1); 
    overflow: hidden;
  }

  #game-container {
    position: absolute; width: 100%; height: 100%;
    background-color: #2b2b2b; border: 4px solid #aaa; box-sizing: border-box;
    image-rendering: pixelated;
  }
  
  @keyframes shake {
    0% { transform: translate(2px, 2px) rotate(0deg); }
    10% { transform: translate(-2px, -2px) rotate(-1deg); }
    20% { transform: translate(-4px, 0px) rotate(1deg); }
    30% { transform: translate(4px, 2px) rotate(0deg); }
    40% { transform: translate(2px, -2px) rotate(1deg); }
    50% { transform: translate(-2px, 2px) rotate(-1deg); }
    60% { transform: translate(-4px, 2px) rotate(0deg); }
    70% { transform: translate(4px, 2px) rotate(-1deg); }
    80% { transform: translate(-2px, -2px) rotate(1deg); }
    90% { transform: translate(2px, 4px) rotate(0deg); }
    100% { transform: translate(2px, -2px) rotate(-1deg); }
  }
  .shake-effect { animation: shake 0.4s; animation-iteration-count: 2; }

  canvas { display: block; width: 100%; height: 100%; }

  #fade-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-color: black; opacity: 1; pointer-events: none;
    transition: opacity 0.5s ease; z-index: 50;
    display: flex; justify-content: center; align-items: center; text-align: center;
  }
  #fade-text { color: #fff; font-size: clamp(16px, 4vw, 20px); transition: opacity 0.3s ease; line-height: 1.5; padding: 0 20px;}

  #objection-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(200, 0, 0, 0.85); opacity: 0; pointer-events: none;
    transition: opacity 0.1s ease; z-index: 60;
    display: flex; justify-content: center; align-items: center;
  }
  #objection-text {
    color: #fff; font-size: clamp(40px, 10vw, 60px); font-weight: bold; font-style: italic;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    transform: scale(0.5); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .objection-active #objection-text { transform: scale(1.2); }

  #dialogue-box {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 32%; min-height: 120px;
    background: linear-gradient(135deg, rgba(0, 30, 80, 0.95), rgba(0, 10, 30, 0.95));
    border-top: 3px solid #fff; border-left: 3px solid #fff; border-right: 3px solid #fff;
    border-radius: 8px 8px 0 0; padding: 15px; box-sizing: border-box;
    display: none; z-index: 20; overflow-y: auto;
  }
  #dialogue-box.trial-mode { background: linear-gradient(135deg, rgba(100, 0, 0, 0.95), rgba(40, 0, 0, 0.95)); }
  #speaker-name { color: #ffd54f; font-size: clamp(14px, 4vw, 18px); margin-bottom: 8px; font-weight: bold; text-shadow: 2px 2px 0px #000; }
  #dialogue-text { font-size: clamp(12px, 3.5vw, 16px); line-height: 1.6; text-shadow: 1px 1px 0px #000; }
  #continue-indicator { position: absolute; bottom: 10px; right: 15px; font-size: 12px; color: #aaa; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  #evidence-menu {
    position: absolute; top: 10px; right: 10px; width: 50%; max-width: 230px;
    background: rgba(0, 0, 0, 0.95); border: 2px solid #aaa; border-radius: 5px;
    padding: 10px; z-index: 30; display: flex; flex-direction: column;
  }
  #evidence-menu.collapsed { width: auto; padding: 5px 10px; }
  #evidence-menu.collapsed #notebook-content { display: none; }
  #toggle-btn {
    text-align: center; background: #444; border: 1px solid #777; border-radius: 3px;
    font-size: 12px; padding: 4px; cursor: pointer; color: #fff;
  }
  #toggle-btn:hover { background: #666; }
  #notebook-content { margin-top: 10px; display: flex; flex-direction: column; flex: 1; min-height: 0;}
  #evidence-menu h3 { margin: 0 0 10px 0; font-size: 14px; color: #4caf50; text-align: center; border-bottom: 1px dashed #fff; padding-bottom: 8px; }
  
  #evidence-list-container { flex: 1; max-height: 220px; overflow-y: auto; overflow-x: hidden; padding-right: 5px;}
  #evidence-list-container::-webkit-scrollbar { width: 6px; }
  #evidence-list-container::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
  
  .category-title { color: #90caf9; font-size: 12px; margin: 10px 0 5px 0; font-weight: bold; border-bottom: 1px solid #444; }
  .evidence-item { font-size: 11px; line-height: 1.5; margin-left: 5px; cursor: pointer; color: #fff; transition: color 0.2s; margin-bottom: 3px; padding: 3px 0;}
  .evidence-item:hover { color: #ffeb3b; text-decoration: underline; background: rgba(255,255,255,0.1); }

  #evidence-modal {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    width: 80%; max-width: 320px; max-height: 90vh; overflow-y: auto;
    background: rgba(20, 20, 20, 0.98);
    border: 3px solid #ffeb3b; border-radius: 8px; padding: 20px;
    display: none; z-index: 40; box-shadow: 0 0 20px rgba(0,0,0,0.9);
  }
  #modal-title { color: #ffeb3b; font-size: 18px; margin-bottom: 5px; font-weight: bold; }
  #modal-category { color: #90caf9; font-size: 12px; margin-bottom: 12px; border-bottom: 1px dashed #555; padding-bottom: 8px;}
  #modal-desc { font-size: 14px; line-height: 1.6; color: #ddd; margin-bottom: 20px; }
  
  .modal-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .btn {
    text-align: center; background: #333; padding: 12px 10px; border-radius: 6px;
    cursor: pointer; font-size: 14px; border: 1px solid #777; color: #fff; width: 100%; box-sizing: border-box; font-family: 'Galmuri11';
  }
  .btn:hover { background: #555; }
  #present-btn { background: #1e88e5; border-color: #1565c0; display: none; font-weight: bold; font-size: 16px;}
  #present-btn:hover { background: #1565c0; }

  #map-name-ui { position: absolute; top: 50px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border: 1px solid #fff; font-size: 12px; color: #fff; z-index: 4; border-radius: 4px;}
  
  #audio-btn {
    position: absolute; top: 10px; left: 10px; z-index: 100;
    padding: 6px 10px; font-family: 'Galmuri11'; background: #d32f2f; color: #fff; border: 2px solid #fff;
    border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0px #000; font-size: 12px;
  }

  #mobile-controls {
    display: none; width: 100%; max-width: 640px; margin-top: 15px;
    padding: 0 15px; box-sizing: border-box; justify-content: space-between; align-items: center;
  }
  .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; grid-gap: 5px; }
  .dpad button, .action-btns button {
    background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255,255,255,0.4);
    color: white; font-family: 'Galmuri11'; border-radius: 8px; font-size: 18px;
    width: 100%; height: 100%; user-select: none; touch-action: manipulation;
  }
  .action-btns { display: flex; gap: 10px; }
  .action-btns button { width: 65px; height: 65px; font-size: 14px; border-radius: 50%; font-weight: bold; }
  #controls-help { margin-top: 15px; font-size: 12px; color: #888; text-align: center; line-height: 1.5; }

  @media (max-width: 768px) {
    #mobile-controls { display: flex; }
    #controls-help { display: none; }
    
    #evidence-menu:not(.collapsed) {
      top: 5%; left: 5%; right: 5%; bottom: 5%; 
      width: 90%; max-width: none; height: 90%; 
      z-index: 100;
    }
    #evidence-menu:not(.collapsed) #evidence-list-container {
      max-height: none; 
    }
    .evidence-item { font-size: 13px; padding: 8px 0; }
    .category-title { font-size: 14px; margin-top: 15px; }
  }

  #portrait-lock {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000; color: #fff; z-index: 9999;
    flex-direction: column; justify-content: center; align-items: center; text-align: center;
  }
  #portrait-lock span { font-size: 50px; margin-bottom: 20px; animation: rotatePhone 1.5s infinite ease-in-out; }
  @keyframes rotatePhone { 0% { transform: rotate(-90deg); } 50% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
  
  @media screen and (max-height: 500px) and (orientation: landscape) {
    #game-wrapper, #mobile-controls, #controls-help { display: none !important; }
    #portrait-lock { display: flex !important; }
  }
</style>
</head>
<body>

<div id="portrait-lock">
  <span>📱</span>
  <h2>세로 모드로 들어주세요!</h2>
  <p style="font-size:14px; color:#aaa; margin-top:10px;">이 게임은 모바일 세로 화면에 최적화되어 있습니다.</p>
</div>

<div id="game-wrapper">
  <button id="audio-btn" onclick="toggleAudio()">🔇 소리 꺼짐</button>
  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div id="map-name-ui">본관 복도</div>
    
    <div id="evidence-menu" class="collapsed">

      <div id="notebook-content">
        <h3>수사 수첩</h3>

<div id="mobile-controls">

    <div style="grid-column: 3; grid-row: 2;"><button id="btn-right">▶</button></div>
    <div style="grid-column: 2; grid-row: 3;"><button id="btn-down">▼</button></div>
  </div>

    <button id="btn-c" style="background: #4caf50;">수첩</button>

</div>

<div id="controls-help">
  [방향키]: 이동 | [Z] / [Space]: 조사·대화 진행<br>
  [C]: 수첩 펴기/접기 | 대결 모드 중 수첩 단서 클릭 ➔ [증거 제시]
</div>

<script>
// ==========================================
// 🎵 사운드 처리 (ON/OFF 토글)
// ==========================================
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let audioEnabled = false;
let bgmInterval;

// 연출 중 조작 방지용 전역 변수
let isAnimating = false; 

function toggleAudio() {
  if(!audioCtx) audioCtx = new AudioContext();
  
  audioEnabled = !audioEnabled;
  const btn = document.getElementById('audio-btn');
  
  if (audioEnabled) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    btn.style.background = '#4caf50';
    btn.innerText = '🔊 소리 켜짐';
    playBGM();
  } else {
    btn.style.background = '#d32f2f';
    btn.innerText = '🔇 소리 꺼짐';
    stopBGM();
  }
}

function playBGM() {
  if (!audioEnabled || bgmInterval) return;
  const playNote = (freq, time) => {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime + time);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time + 0.4);
    osc.start(audioCtx.currentTime + time); osc.stop(audioCtx.currentTime + time + 0.4);
  };
  playNote(150, 0); playNote(200, 0.5); playNote(180, 1.0); playNote(220, 1.5);
  bgmInterval = setInterval(() => {
    playNote(150, 0); playNote(200, 0.5); playNote(180, 1.0); playNote(220, 1.5);
  }, 2000);
}

function stopBGM() {
  clearInterval(bgmInterval);
  bgmInterval = null;
}

function playObjection() {
  if(!audioEnabled) return;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function playEvidenceSound() {
  if(!audioEnabled) return;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// ==========================================
// 게임 로직 및 DB
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.getElementById('game-container');
const dialogueBox = document.getElementById('dialogue-box');
const speakerName = document.getElementById('speaker-name');
const dialogueText = document.getElementById('dialogue-text');
const evidenceMenu = document.getElementById('evidence-menu');
const evidenceListContainer = document.getElementById('evidence-list-container');
const mapNameUI = document.getElementById('map-name-ui');
const fadeOverlay = document.getElementById('fade-overlay');
const fadeText = document.getElementById('fade-text');
const objectionOverlay = document.getElementById('objection-overlay');
const presentBtn = document.getElementById('present-btn');

const evidenceDB = {
  '협박 편지': { category: '연구실', desc: '연구 폐기를 요구하는 문서. 네트워크 프린터에서 원격 출력됐다.' },
  '프린터 출력 이력': { category: '연구실', desc: '연구실의 프린터에서 협박 문서가 출력된 기록.' },
  '잠금 해제 명령': { category: '연구실', desc: '명령 수신은 확인되지만 문 개방은 입증되지 않는다.' },
  '문 열림 센서 기록': { category: '연구실', desc: '사건 시간대에 문이 열린 물리적 기록이 없다. 출입자는 없었다.' },
  'CCTV 시각 불일치': { category: '본관 복도', desc: 'CCTV와 서버 기록의 시각에 3분 차이가 있다. 알리바이의 허점.' },
  '토슈즈와 바닥 왁스': { category: '무용 연습실', desc: '하늘 선배가 연습실에서 연습했다는 흔적.' },
  '연습실 출입 기록': { category: '무용 연습실', desc: '사건 시간대에 30분의 공백. 알리바이의 허점이다.' },
  '강하늘의 논문 초안': { category: '무용 연습실', desc: '사건 당일 연습실을 비웠던 진짜 이유.' },
  '네트워크 구조': { category: '컴퓨터실', desc: '프린터와 도어록이 메인 서버망과 연결되어 원격 제어가 가능하다.' },
  '점검 기록': { category: '컴퓨터실', desc: '오민석이 단순 점검을 위해 접속한 기록. 조작 기록과는 무관하다.' },
  '설정 변경 로그': { category: '컴퓨터실', desc: '사건 시간대, 도진우의 계정으로 서버 설정이 변경된 확고한 로그.' },
  '외부 투자 계약': { category: '학과 회의실', desc: '연구 성과가 외부 투자와 밀접하게 연결되어 막대한 자금이 걸려있다.' },
  '공식 발표 자료': { category: '학과 회의실', desc: '플라이아 교수의 발표 자료. 핵심 개발자인 진우의 이름이 누락됐다.' },
  '초기 연구 노트': { category: '학과 회의실', desc: 'AI 방패의 원본 아이디어가 적힌 노트. 도진우가 분노한 범행 동기.' },
  '반복 자동화 작업': { category: '서버실', desc: '서버실에서 자동 실행된 작업. 사람이 없어도 현장에 있는 것처럼 속인다.' },
  'AI 음성 기록': { category: '서버실', desc: '작업 시스템에서 생성된 가짜 음성 자료. 알리바이 트릭이다.' },
  '인증 기록': { category: '서버실', desc: '도진우에게 등록된 물리적 보안 토큰이 설정 변경 시각에 인증됐다. 해킹이 아니라는 물증.' }
};

let gameState = 'PLAY';
let currentMap = 'corridor'; 
let currentDialogue = [];
let dialogueIndex = 0;
let collectedEvidences = [];
let objects = [];
let isNotebookCollapsed = true; 
let currentSelectedEvidence = '';
let isJinbumRevealed = false; 

let chapterProgress = { chapter1Complete: false, chapter2Complete: false, chapter3Complete: false, chapter4Complete: false };
let defeated = { haneul: false, minseok: false, seoyoon: false, flya: false };
let trial = { active: false, target: '', phase: 0, expectedEvidence: '', currentStatement: '' };

const player = { x: 300, y: 350, width: 32, height: 40, speed: 2.45, facing: 'up' };
let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

let oriCompanion = {
  active: true, x: 300, y: 380, width: 24, height: 24,
  render: function(ctx) {
    if (!this.active) return;
    let hover = Math.sin(Date.now() / 150) * 4;
    ctx.fillStyle = '#ffca28'; ctx.fillRect(this.x, this.y + hover, 24, 24);
    ctx.fillStyle = '#ff8f00'; ctx.fillRect(this.x + 14, this.y + 10 + hover, 12, 6);
    ctx.fillStyle = '#212121'; ctx.fillRect(this.x + 10, this.y + 6 + hover, 4, 4);
    ctx.fillStyle = '#03a9f4'; ctx.fillRect(this.x + 12, this.y - 4 + hover, 4, 6);
    ctx.fillStyle = '#fff'; ctx.font = '10px "Galmuri11"'; ctx.fillText("오리", this.x + 2, this.y - 8 + hover);
  }
};

// 동행 AI 업데이트 로직
oriCompanion.update = function(px, py) {
  if (!this.active) return;
  let targetX = px - 35; let targetY = py - 15;
  this.x += (targetX - this.x) * 0.08; this.y += (targetY - this.y) * 0.08;
};
oriCompanion.interact = function() {
  if (!this.active) return;
  if(trial.active) startDialogue([{ speaker: '오리', text: "상대의 거짓말과 모순되는 확실한 [단서]를 수첩에서 골라 제시해! 모르면 취소 버튼을 누르자." }]);

function hasEvidence(name) { return collectedEvidences.includes(name); }
function addEvidence(name) {
  if (!hasEvidence(name)) {
    collectedEvidences.push(name); updateEvidenceUI();
    playEvidenceSound(); 
    fadeText.innerHTML = `[단서 획득]<br><br>${name}`;
    fadeOverlay.style.backgroundColor = 'rgba(0,0,0,0.5)'; fadeOverlay.style.opacity = '1';
    setTimeout(() => { fadeOverlay.style.opacity = '0'; fadeText.innerHTML = ""; }, 1500);
  }
}

function checkChapter1Complete() {
  if (hasEvidence('협박 편지') && hasEvidence('문 열림 센서 기록') && hasEvidence('CCTV 시각 불일치') && !chapterProgress.chapter1Complete) {
    chapterProgress.chapter1Complete = true;
    startDialogue([
      { speaker: '지널', text: "모든 정황이 일치해. 물리적 출입자가 없다는 게 증명됐어. 1단계 조사는 끝났어." },
      { speaker: '오리', text: "이제 복도의 두 번째 문, '무용 연습실'로 하늘 선배를 만나러 가자!" }
    ]);
  }
}

function updateEvidenceUI() {
  evidenceListContainer.innerHTML = '';
  if (collectedEvidences.length === 0) return;
  const grouped = {};
  const roomOrder = ['연구실', '본관 복도', '무용 연습실', '컴퓨터실', '학과 회의실', '서버실'];
  collectedEvidences.forEach(ev => { const cat = evidenceDB[ev].category; if (!grouped[cat]) grouped[cat] = []; grouped[cat].push(ev); });
  roomOrder.forEach(cat => {
    if (grouped[cat]) {
      const catTitle = document.createElement('div'); catTitle.className = 'category-title'; catTitle.textContent = `[${cat}]`;
      evidenceListContainer.appendChild(catTitle);
      grouped[cat].forEach(ev => {
        const item = document.createElement('div'); item.className = 'evidence-item'; item.textContent = '■ ' + ev;
        item.onclick = () => {
          if (!isNotebookCollapsed && window.innerWidth <= 768) {
            toggleNotebook();
          }
          showEvidenceDetail(ev);
        };
        evidenceListContainer.appendChild(item);
      });
    }
  });
}

function toggleNotebook() {
  isNotebookCollapsed = !isNotebookCollapsed;
  if (isNotebookCollapsed) { evidenceMenu.classList.add('collapsed'); document.getElementById('toggle-btn').textContent = '수첩 펴기 (C)'; } 
  else { evidenceMenu.classList.remove('collapsed'); document.getElementById('toggle-btn').textContent = '수첩 접기 (C)'; }
}

function showEvidenceDetail(name) {
  if (gameState === 'TRANSITION') return;
  currentSelectedEvidence = name;
  const data = evidenceDB[name];
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-category').textContent = `획득 장소: [${data.category}]`;
  document.getElementById('modal-desc').textContent = data.desc;
  
  if (trial.active) {
    presentBtn.style.display = 'block';
    presentBtn.textContent = '제출하겠습니다!';
    document.getElementById('cancel-btn').textContent = '제시 취소';
  } else {
    presentBtn.style.display = 'none';
    document.getElementById('cancel-btn').textContent = '닫기';
  }

  document.getElementById('evidence-modal').style.display = 'block';
  if(gameState === 'PLAY' || gameState === 'TRIAL') gameState = 'EVIDENCE';
}

function closeEvidenceDetail() {
  document.getElementById('evidence-modal').style.display = 'none';
  if(gameState === 'EVIDENCE') {
    if (trial.active) gameState = 'TRIAL';
    else gameState = 'PLAY';
  }
}

// 이의있음 연출 (연출 중 키 입력 차단 기능 포함)
function triggerObjection(callback) {
  isAnimating = true; 
  playObjection(); 
  gameContainer.classList.add('shake-effect');
  objectionOverlay.style.opacity = '1'; objectionOverlay.classList.add('objection-active');
  setTimeout(() => {
    objectionOverlay.style.opacity = '0'; objectionOverlay.classList.remove('objection-active');
    gameContainer.classList.remove('shake-effect');
    if(callback) callback();
    setTimeout(() => { isAnimating = false; }, 300); // 연출 끝난 후 살짝 여유를 두고 락 해제
  }, 1200);
}

function startTrial(targetName, statement, expected) {
  trial.active = true; trial.target = targetName; trial.expectedEvidence = expected; trial.currentStatement = statement;
  gameState = 'TRIAL'; dialogueBox.classList.add('trial-mode');
  if(isNotebookCollapsed) toggleNotebook();
  startDialogue([{ speaker: targetName, text: statement + "\n(모순을 깰 단서를 수첩에서 꺼내 [제출하겠습니다!] 버튼 클릭)" }]);
}

function endTrialMode() {
  trial.active = false; gameState = 'PLAY'; dialogueBox.classList.remove('trial-mode');
}

function presentEvidence(isCanceled = false) {
  closeEvidenceDetail();
  if (isCanceled && trial.active) {
    endTrialMode(); startDialogue([{ speaker: '지널', text: "(아직 이 주장을 반박할 확실한 증거가 수첩에 없어. 대화를 취소하고 단서를 더 찾아보자.)" }]);
    return;
  }
  if (!trial.active) return;
  if (currentSelectedEvidence === trial.expectedEvidence) {
    triggerObjection(() => {
      endTrialMode();
      if (trial.target === '강하늘') handleHanulSuccess();
      else if (trial.target === '오민석') handleMinseokSuccess();
      else if (trial.target === '한서윤') handleSeoyoonSuccess();
      else if (trial.target === '플라이아 교수') handleFlyaSuccess();
      else if (trial.target === '도진우' || trial.target === '도진우 (진범)') handleJinwooSuccess();
    });
  } else {
    endTrialMode(); 
    startDialogue([
      { speaker: '지널', text: "이 증거를 보세요! [" + currentSelectedEvidence + "]입니다!" },
      { speaker: trial.target, text: "...그게 지금 내 말과 무슨 상관인데? 억지 부리지 마." },
      { speaker: '오리', text: "지널, 그 단서로는 모순을 입증할 수 없어. 제대로 된 증거를 찾아와!" }
    ]);
  }
}

function startDialogue(lines, callback = null) {
  // PC 방향키 버그(대화 후 강제 이동)를 막기 위해 대화 시작 시 키보드 입력을 완전히 강제 초기화!
  keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
  if (gameState !== 'TRIAL') gameState = 'DIALOGUE'; 
  currentDialogue = lines; dialogueIndex = 0; dialogueBox.callback = callback; showNextDialogue();
}

function showNextDialogue() {
  if (dialogueIndex < currentDialogue.length) {
    dialogueBox.style.display = 'block'; speakerName.textContent = currentDialogue[dialogueIndex].speaker;
    dialogueText.innerHTML = currentDialogue[dialogueIndex].text.replace(/\n/g, '<br>'); dialogueIndex++;
  } else {
    dialogueBox.style.display = 'none'; 
    if(gameState !== 'TRIAL') gameState = 'PLAY';
    if (dialogueBox.callback) { dialogueBox.callback(); dialogueBox.callback = null; }
  }
}

function changeMap(newMapId, spawnX, spawnY, facing='down') {
  gameState = 'TRANSITION'; fadeOverlay.style.backgroundColor = 'black'; fadeOverlay.style.opacity = '1';
  setTimeout(() => {
    currentMap = newMapId; objects = maps[newMapId].initObjects(); mapNameUI.textContent = maps[newMapId].name;
    player.x = spawnX; player.y = spawnY; player.facing = facing;
    oriCompanion.x = player.x - 20; oriCompanion.y = player.y;
    fadeOverlay.style.opacity = '0'; gameState = 'PLAY';
  }, 500);
}

// ==== 입력 제어 ====
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); // 스크롤링 원천 차단
  
  if (isAnimating) return; // 연출 중 조작 차단
  if (e.code === 'KeyC') toggleNotebook();
  
  if (gameState === 'PLAY') {
    if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
    if (e.code === 'KeyZ' || e.code === 'Space') handleZPress();
  } else if (gameState === 'DIALOGUE' || gameState === 'TRIAL' || gameState === 'EVIDENCE') {
    if (e.code === 'KeyZ' || e.code === 'Space' || (gameState === 'EVIDENCE' && e.code === 'Escape')) handleZPress();
  }
});
window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

const btnLeft = document.getElementById('btn-left'); const btnRight = document.getElementById('btn-right');
const btnZ = document.getElementById('btn-z'); const btnC = document.getElementById('btn-c');

const bindBtn = (btn, code) => {
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); if(!isAnimating) keys[code] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
  btn.addEventListener('mousedown', (e) => { e.preventDefault(); if(!isAnimating) keys[code] = true; });
  btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[code] = false; });
  btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[code] = false; });
};
bindBtn(btnUp, 'ArrowUp'); bindBtn(btnDown, 'ArrowDown'); bindBtn(btnLeft, 'ArrowLeft'); bindBtn(btnRight, 'ArrowRight');

btnZ.addEventListener('touchstart', (e) => { e.preventDefault(); handleZPress(); });
btnZ.addEventListener('mousedown', (e) => { e.preventDefault(); handleZPress(); });
btnC.addEventListener('touchstart', (e) => { e.preventDefault(); toggleNotebook(); });
btnC.addEventListener('mousedown', (e) => { e.preventDefault(); toggleNotebook(); });

function checkInteraction() {
  const range = 25; let cx = player.x + player.width / 2; let cy = player.y + player.height / 2;
  if (player.facing === 'up') cy -= range; else if (player.facing === 'down') cy += range; else if (player.facing === 'left') cx -= range; else if (player.facing === 'right') cx += range;

  let interactables = [...objects];
  if (oriCompanion.active) interactables.push({ x: oriCompanion.x, y: oriCompanion.y, width: oriCompanion.width, height: oriCompanion.height, interact: oriCompanion.interact.bind(oriCompanion) });

  for (let obj of interactables) {
    if (cx >= obj.x - 10 && cx <= obj.x + obj.width + 10 && cy >= obj.y - 10 && cy <= obj.y + obj.height + 10) {
      obj.interact(); break;
    }
  }
}

function drawPlayer(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(player.x+4, player.y+36, 24, 6); 
  ctx.fillStyle = '#1e88e5'; ctx.fillRect(player.x+4, player.y+16, 24, 24); 
  ctx.fillStyle = '#ffe0bd'; ctx.fillRect(player.x+6, player.y, 20, 16); 
  ctx.fillStyle = '#424242'; ctx.fillRect(player.x+4, player.y-4, 24, 8); 
  ctx.fillStyle = '#000'; 
  if (player.facing === 'down') { ctx.fillRect(player.x+10, player.y+6, 3, 3); ctx.fillRect(player.x+19, player.y+6, 3, 3); } 
  else if (player.facing === 'left') { ctx.fillRect(player.x+6, player.y+6, 3, 3); } 
  else if (player.facing === 'right') { ctx.fillRect(player.x+23, player.y+6, 3, 3); }
}

function isColliding(px, py, pw, ph, obj) {
  if (obj.solid === false) return false;
  return px < obj.x + obj.width && px + pw > obj.x && py < obj.y + obj.height && py + ph > obj.y;
}

function update() {
  // 모바일 속도 1.5배 올림: 7.35 / PC: 2.45
  player.speed = (window.innerWidth <= 768 || 'ontouchstart' in window) ? 7.35 : 2.45;

  if (gameState === 'PLAY' && !isAnimating) {
    let dx = 0; let dy = 0;
    if (keys.ArrowUp) { dy -= player.speed; player.facing = 'up'; }
    if (keys.ArrowDown) { dy += player.speed; player.facing = 'down'; } // 방향키 버그 완전 수정 완료!
    if (keys.ArrowLeft) { dx -= player.speed; player.facing = 'left'; }
    if (keys.ArrowRight) { dx += player.speed; player.facing = 'right'; }

    let newX = player.x + dx; let collisionX = false;
    for (let obj of objects) { if (isColliding(newX, player.y, player.width, player.height, obj)) { collisionX = true; break; } }
    if (!collisionX) player.x = newX;

    let newY = player.y + dy; let collisionY = false;
    for (let obj of objects) { if (isColliding(player.x, newY, player.width, player.height, obj)) { collisionY = true; break; } }
    if (!collisionY) player.y = newY;

    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
    
    oriCompanion.update(player.x, player.y);
  }
}

function drawBgStyle(ctx) {
  ctx.lineWidth = 1;
  if(currentMap === 'corridor') {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
    for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }
    ctx.fillStyle = 'rgba(100, 200, 255, 0.1)'; ctx.fillRect(440, 20, 150, 60); ctx.fillRect(440, 100, 150, 60);
  } else if(currentMap === 'lab') {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
    for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }
  } else if(currentMap === 'practice') {
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
    for(let i=0; i<canvas.height; i+=30) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }
  } else if(currentMap === 'computer') {
    ctx.strokeStyle = 'rgba(0, 200, 255, 0.1)';
    for(let i=0; i<canvas.width; i+=20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
    for(let i=0; i<canvas.height; i+=20) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }
  } else if(currentMap === 'meeting') {
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
    for(let i=0; i<canvas.width; i+=10) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
  } else if(currentMap === 'server') {
    ctx.strokeStyle = 'rgba(255, 0, 0, 0.2)'; ctx.lineWidth = 2;
    for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+20, canvas.height); ctx.stroke(); }
  }
}

// Y축 기반 렌더링 시스템 적용(캐릭터와 사물이 자연스럽게 겹침)
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBgStyle(ctx);

  let renderItems = [];
  objects.forEach(obj => {
    renderItems.push({ 
      bottomY: obj.y + (obj.height || 0), 
      render: () => {
        obj.render(ctx); 
        ctx.fillStyle = '#fff'; ctx.font = '11px "Galmuri11"'; ctx.fillText(obj.label, obj.x, obj.y - 8);
      } 
    });
  });
  
  renderItems.push({ bottomY: player.y + player.height, render: () => drawPlayer(ctx) });
  
  if (oriCompanion.active) {
    renderItems.push({ bottomY: oriCompanion.y + oriCompanion.height, render: () => oriCompanion.render(ctx) });
  }

  // 바닥 Y좌표 기준 오름차순 정렬 (아래에 있는게 더 나중에 그려져서 위에 덮어씌움)
  renderItems.sort((a, b) => a.bottomY - b.bottomY);
  renderItems.forEach(item => item.render());
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
